server {
    listen 80;
    server_name _;
    root /opt/recodex-core/www;
    index index.php;

    client_max_body_size 512M;

    # front controller (mirrors www/.htaccess rewrite rules)
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # never expose dotfiles (except /.well-known for e.g. ACME challenges)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
